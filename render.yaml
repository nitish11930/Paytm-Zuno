# Free demo deployment; business records use Supabase, local call-budget counter is ephemeral.
services:
  - type: web
    name: zuno-friend-test
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: TEST_ACCESS_CODE
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_DAILY_CALL_LIMIT
        value: 100
      - key: DB_PROVIDER
        value: postgres
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_CA_PATH
        value: /app/deploy/supabase-ca.crt
